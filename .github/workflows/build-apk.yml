name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinema-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate launcher icons
        run: bash tools/make-icons.sh kiplay.png

      - name: Sync web UI into Android assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

      - name: Verify required Android resources
        run: |
          test -f app/src/main/res/values/strings.xml
          test -f app/src/main/res/values/themes.xml
          test -f app/src/main/res/xml/network_security_config.xml
          test -f app/src/main/res/layout/activity_player.xml
          test -f app/src/main/kotlin/com/mazkiplay/cinema/PlayerActivity.kt

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: M4zk1pL4yCinema-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cinema-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: M4zk1pL4y Cinema Build ${{ github.run_number }}
          body: |
            Automated Android APK build from commit ${{ github.sha }}.
            Install the attached app-debug.apk on Android.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
