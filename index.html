<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#08070d">
<meta name="color-scheme" content="dark">
<title>M4zk1pL4y Cinema</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#08070d; --bg2:#0f0e18; --card:#171622; --card2:#201f2e; --line:#2a2839;
  --tx:#f6f5fa; --tx2:#a09fb5; --tx3:#6e6d85;
  --acc:#ff2f6d; --acc2:#8b5cf6; --ok:#22c55e;
  --nav:68px;
  --grad:linear-gradient(135deg,#ff2f6d,#a855f7 55%,#8b5cf6);
  --glow:0 18px 44px -14px rgba(255,47,109,.55);
  --shade:linear-gradient(to top,#08070d 1%,rgba(8,7,13,.9) 26%,rgba(8,7,13,.2) 62%,rgba(8,7,13,.55) 100%);
}
html[data-theme="light"]{
  --bg:#f7f6fb; --bg2:#fff; --card:#fff; --card2:#f1f0f8; --line:#e4e3ef;
  --tx:#131220; --tx2:#5f5e78; --tx3:#8d8ca4;
  --shade:linear-gradient(to top,#f7f6fb 1%,rgba(247,246,251,.92) 26%,rgba(247,246,251,.22) 62%,rgba(0,0,0,.4) 100%);
}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overscroll-behavior:none;line-height:1.45;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.hidden{display:none!important}
::selection{background:var(--acc);color:#fff}
::-webkit-scrollbar{width:0;height:0}

#splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;text-align:center;overflow-y:auto;
  padding:calc(env(safe-area-inset-top) + 30px) 26px calc(env(safe-area-inset-bottom) + 30px);
  background:radial-gradient(120% 80% at 50% -10%,#2c1140 0%,#0c0716 48%,#08070d 100%)}
#splash::before{content:"";position:absolute;width:360px;height:360px;border-radius:50%;
  background:var(--grad);filter:blur(100px);opacity:.4;top:-110px;animation:float 8s ease-in-out infinite}
@keyframes float{50%{transform:translateY(30px) scale(1.15)}}
.sp-logo{width:92px;height:92px;border-radius:30px;background:var(--grad);display:grid;place-items:center;
  font-weight:900;font-size:32px;color:#fff;letter-spacing:-1.5px;position:relative;z-index:1;
  box-shadow:0 24px 60px -14px rgba(255,47,109,.75);animation:pop .65s cubic-bezier(.2,1.4,.4,1) both}
.sp-logo::after{content:"";position:absolute;inset:-3px;border-radius:33px;border:1px solid rgba(255,255,255,.25)}
@keyframes pop{from{transform:scale(.5) rotate(-14deg);opacity:0}}
.sp-name{font-size:clamp(21px,6.4vw,29px);font-weight:900;letter-spacing:-.7px;position:relative;z-index:1;
  background:linear-gradient(100deg,#fff,#ffc9da 45%,#c9b6ff);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;animation:up .7s .1s both}
.sp-welcome{max-width:330px;font-size:clamp(13.5px,3.7vw,15px);color:#cbc6da;line-height:1.7;
  position:relative;z-index:1;animation:up .7s .18s both}
.sp-welcome b{color:#fff}
.sp-by{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#8e88a6;font-weight:800;
  position:relative;z-index:1;animation:up .7s .26s both}
.sp-btn{margin-top:6px;position:relative;z-index:1;min-width:215px;padding:16px 32px;border-radius:999px;
  background:var(--grad);color:#fff;font-weight:800;font-size:15px;letter-spacing:.3px;
  box-shadow:0 18px 44px -14px rgba(139,92,246,.95);animation:up .7s .34s both;transition:transform .16s,filter .16s}
.sp-btn:active{transform:scale(.95);filter:brightness(1.15)}
.sp-note{font-size:11px;color:#716b87;position:relative;z-index:1;animation:up .7s .42s both}
@keyframes up{from{opacity:0;transform:translateY(16px)}}

#app{min-height:100dvh;display:flex;flex-direction:column}
#views{flex:1;position:relative;min-height:0}
.view{display:none;height:100dvh;min-height:560px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view.active{display:block}
.view.pad{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 26px)}

.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:9px;
  padding:calc(env(safe-area-inset-top) + 12px) 15px 12px;
  background:linear-gradient(to bottom,rgba(8,7,13,.95),rgba(8,7,13,.7) 68%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
html[data-theme="light"] .topbar{background:linear-gradient(to bottom,rgba(247,246,251,.97),rgba(247,246,251,.75) 68%,transparent)}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand-mark{width:33px;height:33px;border-radius:11px;background:var(--grad);display:grid;place-items:center;
  font-weight:900;font-size:13px;color:#fff;flex:none;box-shadow:0 8px 18px -7px rgba(255,47,109,.95)}
.brand-txt{font-weight:900;font-size:15.5px;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt span{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.icon-btn{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--tx);transition:.15s}
.icon-btn:active{transform:scale(.9);background:rgba(255,255,255,.14)}
html[data-theme="light"] .icon-btn{background:rgba(0,0,0,.035)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#v-feed{padding:0;scroll-snap-type:y mandatory;scroll-padding-bottom:var(--nav)}
.feed-card{position:relative;height:100dvh;min-height:560px;scroll-snap-align:start;scroll-snap-stop:always;
  display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:var(--card)}
.fc-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  background:linear-gradient(160deg,#201338,#0c0817);transform:scale(1.01)}
.fc-img.err{opacity:0}
.fc-shade{position:absolute;inset:0;background:var(--shade)}
.fc-body{position:relative;z-index:2;padding:0 18px calc(var(--nav) + env(safe-area-inset-bottom) + 24px);
  display:flex;flex-direction:column;gap:11px}
.fc-badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:800;padding:5px 10px;border-radius:999px;letter-spacing:.2px;
  background:rgba(255,255,255,.13);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);color:#fff}
.badge.hot{background:var(--grad);border-color:transparent}
.badge.dub{background:rgba(34,197,94,.3);border-color:rgba(34,197,94,.5)}
.badge.sub{background:rgba(59,130,246,.3);border-color:rgba(59,130,246,.5)}
.fc-title{font-size:clamp(22px,7vw,31px);font-weight:900;line-height:1.1;letter-spacing:-1px;
  text-shadow:0 3px 24px rgba(0,0,0,.65)}
.fc-intro{font-size:13px;color:#d5d4e2;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;
  -webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 14px rgba(0,0,0,.75)}
html[data-theme="light"] .fc-title{color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.85)}
html[data-theme="light"] .fc-intro{color:#eae9f3}
.fc-row{display:flex;gap:9px;align-items:center;margin-top:2px}
.btn-play{flex:1;padding:15px 18px;border-radius:999px;background:var(--grad);color:#fff;font-weight:900;
  font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:var(--glow);transition:transform .15s;position:relative;overflow:hidden}
.btn-play::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 55%)}
.btn-play:active{transform:scale(.96)}
.btn-play svg{width:17px;height:17px;fill:#fff;stroke:none;position:relative;z-index:1}
.sq-btn{width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;
  backdrop-filter:blur(12px);transition:.15s}
.sq-btn:active{transform:scale(.9)}
.sq-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sq-btn.on{background:var(--acc);border-color:transparent}
.sq-btn.on svg{fill:#fff;stroke:#fff}

.cont-card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:0 18px calc(var(--nav) + env(safe-area-inset-bottom) + 92px)}
.cont-lbl{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:900;letter-spacing:1.5px;
  text-transform:uppercase;color:#fff;background:var(--grad);padding:6px 13px;border-radius:999px;
  margin-bottom:12px;width:max-content;box-shadow:var(--glow)}
.cont-lbl svg{width:11px;height:11px;fill:#fff;stroke:none}

#contBar{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 10px);
  z-index:55;display:none;align-items:center;gap:10px;padding:8px 10px 8px 8px;border-radius:18px;
  background:rgba(23,22,34,.94);border:1px solid var(--line);backdrop-filter:blur(20px);
  box-shadow:0 16px 44px -14px #000}
html[data-theme="light"] #contBar{background:rgba(255,255,255,.96)}
#contBar.on{display:flex;animation:up .3s both}
#contBar img{width:38px;aspect-ratio:336/478;object-fit:cover;border-radius:10px;flex:none;background:var(--card2)}
#contBar .tx{flex:1;min-width:0}
#contBar b{display:block;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#contBar small{font-size:10.5px;color:var(--tx3);font-weight:700}
#contBar .pb{height:3px;border-radius:9px;background:var(--line);margin-top:5px;overflow:hidden}
#contBar .pb i{display:block;height:100%;background:var(--grad);border-radius:9px}
#contBar .go{width:37px;height:37px;border-radius:50%;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:var(--glow)}
#contBar .go svg{width:14px;height:14px;fill:#fff;stroke:none;margin-left:2px}

.sec{padding:20px 0 4px}
.sec-hd{display:flex;align-items:baseline;gap:8px;padding:0 16px 12px}
.sec-hd h3{font-size:16.5px;font-weight:900;letter-spacing:-.4px}
.sec-hd span{font-size:11.5px;color:var(--tx3);font-weight:700}
.sec-hd .lnk{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--acc)}
.rail{display:flex;gap:11px;overflow-x:auto;padding:2px 16px 14px;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}

.pcard{flex:none;width:118px;scroll-snap-align:start;text-align:left;position:relative;transition:transform .15s}
.pcard:active{transform:scale(.965)}
.pcard .ph{position:relative;width:100%;aspect-ratio:336/478;border-radius:16px;overflow:hidden;
  background:linear-gradient(160deg,#211540,#0e0a1b);border:1px solid rgba(255,255,255,.07);
  box-shadow:0 10px 26px -14px rgba(0,0,0,.9)}
html[data-theme="light"] .pcard .ph{border-color:rgba(0,0,0,.06)}
.pcard .ph img{width:100%;height:100%;object-fit:cover}
.pcard .ph img.err{opacity:0}
.pcard .ep-tag{position:absolute;bottom:6px;left:6px;font-size:9.5px;font-weight:800;color:#fff;
  padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.66);backdrop-filter:blur(6px)}
.pcard .rk{position:absolute;top:0;left:0;min-width:27px;height:27px;padding:0 6px;display:grid;place-items:center;
  font-size:12.5px;font-weight:900;color:#fff;background:var(--grad);border-bottom-right-radius:11px}
.pcard .pbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.5)}
.pcard .pbar i{display:block;height:100%;background:var(--acc)}
.pcard .dubb{position:absolute;top:6px;right:6px;font-size:8.5px;font-weight:900;color:#fff;
  padding:2px 6px;border-radius:5px;background:rgba(34,197,94,.92);letter-spacing:.4px}
.pcard h4{font-size:12.5px;font-weight:700;margin-top:8px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard small{font-size:10.5px;color:var(--tx3);font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 11px;padding:4px 16px 22px}
.grid .pcard{width:auto}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 14px}
.chip{flex:none;padding:9px 15px;border-radius:999px;font-size:12.5px;font-weight:800;
  background:var(--card2);border:1px solid var(--line);color:var(--tx2);white-space:nowrap;transition:.15s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow)}
.chip.dub.on{background:linear-gradient(135deg,#22c55e,#0ea5e9);box-shadow:0 14px 34px -14px rgba(34,197,94,.8)}

.searchbar{display:flex;align-items:center;gap:9px;margin:0 16px 13px;padding:0 15px;height:47px;
  background:var(--card2);border:1px solid var(--line);border-radius:15px;transition:border-color .15s}
.searchbar:focus-within{border-color:var(--acc)}
.searchbar svg{width:18px;height:18px;stroke:var(--tx3);fill:none;stroke-width:2;flex:none}
.searchbar input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font-size:14.5px}
.searchbar input::placeholder{color:var(--tx3)}
.hist-chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 16px 18px}

.state{padding:60px 30px;text-align:center;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:12px}
.state .em{font-size:42px;opacity:.85}
.state h4{font-size:15px;font-weight:800;color:var(--tx)}
.state p{font-size:12.5px;max-width:270px;line-height:1.6}
.state button{padding:12px 24px;border-radius:999px;background:var(--grad);color:#fff;font-weight:800;
  font-size:13px;margin-top:4px;box-shadow:var(--glow)}

.sk{background:linear-gradient(100deg,var(--card) 30%,var(--card2) 50%,var(--card) 70%);
  background-size:220% 100%;animation:shim 1.3s infinite linear;border-radius:14px}
@keyframes shim{to{background-position:-220% 0}}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:rgba(10,9,17,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--line)}
html[data-theme="light"] #nav{background:rgba(255,255,255,.95)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--tx3);font-size:9.5px;font-weight:800;letter-spacing:.2px;transition:color .16s;position:relative}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;transition:.16s}
.nav-item.on{color:var(--acc)}
.nav-item.on svg{stroke-width:2.3;transform:translateY(-1px)}
.nav-item:active{transform:scale(.93)}

.sheet{position:fixed;inset:0;z-index:120;background:var(--bg);display:none;flex-direction:column;
  overflow-y:auto;overscroll-behavior:contain}
.sheet.open{display:flex;animation:slideIn .28s cubic-bezier(.3,.9,.3,1)}
@keyframes slideIn{from{transform:translateY(26px);opacity:0}}

.d-hero{position:relative;flex:none;min-height:350px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.d-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(3px) brightness(.5);transform:scale(1.08)}
.d-shade{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 1%,rgba(8,7,13,.85) 42%,rgba(8,7,13,.28) 100%)}
.d-top{position:absolute;top:0;left:0;right:0;display:flex;gap:9px;
  padding:calc(env(safe-area-inset-top) + 13px) 15px 13px;z-index:3}
.d-top .sp{flex:1}
.d-inner{position:relative;z-index:2;display:flex;gap:15px;padding:17px;align-items:flex-end}
.d-cover{width:112px;aspect-ratio:336/478;border-radius:17px;object-fit:cover;flex:none;
  border:1.5px solid rgba(255,255,255,.22);box-shadow:0 20px 44px -16px #000;background:var(--card)}
.d-meta{min-width:0;flex:1;padding-bottom:4px}
.d-title{font-size:clamp(19px,5.4vw,25px);font-weight:900;line-height:1.15;letter-spacing:-.6px;margin-bottom:9px}
.d-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.d-tags span{font-size:10px;font-weight:800;padding:4px 9px;border-radius:7px;
  background:rgba(255,255,255,.14);color:#fff;backdrop-filter:blur(8px)}
.d-tags span.g{background:rgba(34,197,94,.88)}
.d-tags span.b{background:rgba(59,130,246,.88)}
.d-body{padding:0 16px 34px;display:flex;flex-direction:column;gap:18px}
.d-act{display:flex;gap:9px}
.d-act .btn-play{flex:1}
.d-syn{font-size:13.5px;color:var(--tx2);line-height:1.75}
.d-syn.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more-btn{align-self:flex-start;font-size:12.5px;font-weight:800;color:var(--acc)}
.blk-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.blk-hd h4{font-size:14.5px;font-weight:900}
.blk-hd small{font-size:11.5px;color:var(--tx3);font-weight:700}

.ep-list{display:flex;flex-direction:column;gap:9px}
.ep-row{display:flex;align-items:center;gap:11px;padding:7px;border-radius:15px;
  background:var(--card);border:1px solid var(--line);text-align:left;transition:.15s;position:relative;overflow:hidden}
.ep-row:active{transform:scale(.985);background:var(--card2)}
.ep-th{position:relative;width:86px;aspect-ratio:16/10;border-radius:10px;overflow:hidden;flex:none;background:var(--card2)}
.ep-th img{width:100%;height:100%;object-fit:cover}
.ep-th .num{position:absolute;left:5px;top:5px;font-size:9px;font-weight:900;color:#fff;
  padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.74);backdrop-filter:blur(4px)}
.ep-th .dur{position:absolute;right:5px;bottom:5px;font-size:8.5px;font-weight:800;color:#fff;
  padding:2px 5px;border-radius:4px;background:rgba(0,0,0,.74)}
.ep-th .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.45)}
.ep-th .prog i{display:block;height:100%;background:var(--acc)}
.ep-tx{flex:1;min-width:0}
.ep-tx b{display:block;font-size:13px;font-weight:800}
.ep-tx small{font-size:11px;color:var(--tx3);font-weight:700}
.ep-row.cur{border-color:rgba(255,47,109,.5);background:rgba(255,47,109,.07)}
.ep-row.cur .ep-tx b{color:var(--acc)}
.ep-dl{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:var(--card2);border:1px solid var(--line);color:var(--tx2);transition:.15s}
.ep-dl svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ep-dl.done{color:var(--ok);border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.12)}
.ep-dl:active{transform:scale(.9)}

#player{background:#000;overflow:hidden;display:none;flex-direction:column}
#player.open{display:flex}
#player:fullscreen{height:100dvh}
.p-wrap{position:relative;flex:1;display:grid;place-items:center;min-height:0;background:#000;touch-action:pan-y;overflow:hidden}
#pvideo{width:100%;height:100%;max-height:100%;object-fit:contain;background:#000;display:block;outline:0}
#player.native-mode #pvideo{height:auto;max-height:100%}
#player.native-mode .p-bot,#player.native-mode .p-center,#player.native-mode #pSub{display:none!important}
.p-top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 11px) 12px 26px;
  background:linear-gradient(to bottom,rgba(0,0,0,.85),transparent)}
.p-top .t{flex:1;min-width:0;font-size:13px;font-weight:800;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-top .icon-btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.2);color:#fff;width:34px;height:34px;border-radius:11px}

const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){
  if(HAS("toast")){ try{ BR.toast(msg); }catch(e){} }
  const t = $("#toast"); if(!t) return;
  t.textContent = msg; t.classList.add("on");
  clearTimeout(t._t); t._t = setTimeout(()=> t.classList.remove("on"), 2200);
}

/* ---------- API layer ---------- */
const PROXIES = [
  u => u,
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?" + encodeURIComponent(u)
];
const withTimeout = (p,ms)=> Promise.race([p, new Promise((_,r)=> setTimeout(()=> r(new Error("t")), ms))]);

async function api(path, params){
  const qs = params ? "?" + new URLSearchParams(params).toString() : "";
  const url = API + path + qs;
  const tries = PROXIES.map(p => (async () => {
    const r = await withTimeout(fetch(p(url), {headers:{"Accept":"application/json"}}), 7000);
    if(!r.ok) throw new Error("http");
    const j = JSON.parse(await r.text());
    if(!j || (j.code !== 0 && j.code !== 200)) throw new Error("api");
    return j;
  })());
  try { return await Promise.any(tries); }
  catch(e){ throw new Error("network"); }
}

const getDetail = id  => api("/detail/" + encodeURIComponent(id), {lang:S.lang, code:CODE});

async function loadFeed(reset){
  if(S.feedLoading) return;
  if(!reset && S.feedDone) return;
  S.feedLoading = true;
  if(reset){ S.feedOffset = 0; S.feedDone = false; S.pool = []; $("#feedList").innerHTML = ""; feedSkeleton(2); }
  try{
    const j = await getHome(S.feedOffset);
    clearSkel();
    let items = j.data || [];
    if(S.dubOnly) items = items.filter(x=> isDub(x.name));
    if(!items.length) S.feedDone = true;
    items.forEach((it,i)=>{ S.pool.push(it); $("#feedList").appendChild(feedCard(it, S.feedOffset + i)); });
    S.feedOffset += (j.data || []).length;
    if((j.data||[]).length < 6) S.feedDone = true;
    if(!$("#feedList").children.length) emptyFeed();
    if(reset) injectContinueCard();
  }catch(e){
    clearSkel();
    if(!$("#feedList").children.length) emptyFeed();
    else toast("Gagal memuat lebih banyak");
  }
  S.feedLoading = false;
  updateContBar();
}

/* ---------- download ---------- */
const safeName = t => String(t||"drama").replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"_").slice(0,60) || "drama";
const bustUrl = u => u + (u.includes("?") ? "&" : "?") + "_mz=" + Date.now();

async function grabBlob(url){
  const cands = [url, ...V_PROXIES.map(p=> p(bustUrl(url)))];
  for(const u of cands){
    try{
      const r = await fetch(u, {referrerPolicy:"no-referrer"});
      if(!r.ok) continue;
      const b = await r.blob();
      if(b.size > 4096) return b;
    }catch(e){}
  }
  throw new Error("dl");
}
async function saveVideo(url, title, ep){
  const name = safeName(title) + "_Ep" + ep + ".mp4";
  if(HAS("download")){
    try{ BR.download(url, name); toast("Diunduh ke folder Download"); return; }catch(e){}
  }
  const b = await grabBlob(url);
  const file = (typeof File === "function") ? new File([b], name, {type:"video/mp4"}) : null;
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); return; }catch(e){}
  }
  const o = URL.createObjectURL(b);
  const a = document.createElement("a");
  a.href = o; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(o), 60000);
}

const V_PROXIES = [
  u => "https://test.cors.workers.dev/?" + u,
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u)
];
const REF_VARIANTS = ["no-referrer","origin","unsafe-url"];
const HLS_CDN = "https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js";

function loadHls(){
  if(window.Hls) return Promise.resolve(window.Hls);
  if(hlsLoading) return hlsLoading;
  hlsLoading = new Promise((res, rej)=>{
    const s = document.createElement("script");
    s.src = HLS_CDN; s.async = true;
    s.onload = ()=> window.Hls ? res(window.Hls) : rej(new Error("hls"));
    s.onerror = ()=> rej(new Error("hls"));
    document.head.appendChild(s);
  });
  return hlsLoading;
}
function destroyHls(){ if(hls){ try{ hls.destroy(); }catch(e){} hls = null; } }

function buildAttempts(url){
  const out = [];
  const securePage = location.protocol === "https:";
  const insecureSrc = /^http:/i.test(url);
  if(!(securePage && insecureSrc)){
    REF_VARIANTS.forEach(r => out.push({u:url, ref:r, kind:"direct"}));
  }
  V_PROXIES.forEach(p => out.push({u:p(bustUrl(url)), ref:"no-referrer", kind:"proxy"}));
  return out;
}

async function loadSource(ep){
  showBuf(); failOn(false);
  clearTimeout(wd); destroyHls();
  try{
    const j = await getVideo(curDetail.id, ep);
    vData = j;
    const all = (j.qualityList||[]).slice().sort((a,b)=> parseInt(b.label) - parseInt(a.label));
    if(!all.length) throw new Error("kosong");
    let order;
    if(S.quality !== "auto"){
      const p = all.find(q=> q.label === S.quality);
      order = p ? [p, ...all.filter(q=> q !== p)] : all;
    }else{
      const p = all.find(q=> q.label === "480p") || all.find(q=> q.label === "360p") || all[all.length-1];
      order = [p, ...all.filter(q=> q !== p)];
    }
    qList = order; qIdx = 0; tIdx = 0; refetchN = 0;
    pickQuality();
  }catch(e){
    hideBuf();
    failOn(true, "Sumber video tidak merespons. Coba lagi atau pakai mode native.");
  }
}

function setQualLabel(l){
  const a = $("#pQual"); if(a) a.textContent = l;
  const b = $("#pQualN"); if(b) b.textContent = l;
}

function pickQuality(){
  if(qIdx >= qList.length) return exhausted();
  const q = qList[qIdx];
  setQualLabel(q.label);
  tries = buildAttempts(q.url); tIdx = 0;
  attempt();
}

async function attempt(){
  const v = $("#pvideo");
  if(!v) return;
  if(tIdx >= tries.length){ qIdx++; return pickQuality(); }
  const t = tries[tIdx++];
  const tok = ++srcTok;
  curTry = t;
  clearTimeout(wd);
  destroyHls();
  const url = t.kind === "direct" ? bustUrl(t.u) : t.u;
  const isHls = /\.m3u8(\?|$)/i.test(url);

  if(isHls){
    try{ await loadHls(); }catch(e){}
    if(srcTok !== tok) return;
    if(window.Hls && window.Hls.isSupported()){
      try{
        hls = new window.Hls({enableWorker:true, maxBufferLength:30, backBufferLength:30});
        hls.on(window.Hls.Events.ERROR, (_, data)=>{ if(data && data.fatal && srcTok === tok) attempt(); });
        hls.on(window.Hls.Events.MANIFEST_PARSED, ()=>{ if(srcTok === tok) v.play().catch(()=>{}); });
        hls.attachMedia(v);
        hls.loadSource(url);
        showBuf();
        wd = setTimeout(()=>{ if(srcTok === tok && v.readyState < 2) attempt(); }, 16000);
        return;
      }catch(e){ destroyHls(); }
    }
  }

  try{ v.referrerPolicy = t.ref; }catch(e){}
  v.src = url;
  try{ v.load(); }catch(e){}
  v.onerror = ()=>{ if(srcTok === tok) attempt(); };
  const wdMs = t.kind === "direct" ? 8000 : 16000;
  wd = setTimeout(()=>{ if(srcTok === tok && v.readyState < 2) attempt(); }, wdMs);
  showBuf();
  const pr = v.play();
  if(pr && pr.catch) pr.catch(err=>{
    if(srcTok !== tok) return;
    if(err && err.name === "NotAllowedError" && !v.muted){
      v.muted = true;
      const s = $("#pSound"); if(s) s.classList.add("on");
      v.play().catch(()=>{});
    }
  });
}

function retrySame(){
  const v = $("#pvideo"); if(!v || !curTry) return;
  destroyHls();
  const tok = ++srcTok;
  try{ v.referrerPolicy = curTry.ref; }catch(e){}
  v.src = curTry.kind === "direct" ? bustUrl(curTry.u) : curTry.u;
  try{ v.load(); }catch(e){}
  v.onerror = ()=>{ if(srcTok === tok) attempt(); };
  v.play().catch(()=>{});
  showBuf();
}

function exhausted(){
  if(refetchN < 2){
    refetchN++;
    setTimeout(()=> loadSource(vEp), 800 * refetchN);
    return;
  }
  hideBuf();
  failOn(true, "Semua sumber gagal. Coba mode native, turunkan kualitas, atau buka di luar.");
}

function startWatch(){
  stopWatch();
  lastProgAt = Date.now();
  watchInt = setInterval(()=>{
    const v = $("#pvideo");
    if(!v || v.paused || v.ended || !v.duration) return;
    if(Date.now() - lastProgAt > 14000){
      lastProgAt = Date.now();
      retrySame();
    }
  }, 2500);
}
function stopWatch(){ if(watchInt){ clearInterval(watchInt); watchInt = null; } }

async function wake(on){
  if(HAS("keepAwake")){ try{ BR.keepAwake(!!on); }catch(e){} }
  try{
    if(on){
      if("wakeLock" in navigator && !wl){
        wl = await navigator.wakeLock.request("screen");
        wl.addEventListener("release", ()=>{ wl = null; });
      }
    }else if(wl){ await wl.release(); wl = null; }
  }catch(e){}
}

function openQuality(){
  if(!vData || !vData.qualityList){ toast("Kualitas belum tersedia"); return; }
  const list = vData.qualityList.slice().sort((a,b)=> parseInt(b.label) - parseInt(a.label));
  const labels = list.map(q=> q.label);
  if(S.quality !== "auto") labels.unshift("auto");
  const curLbl = ($("#pQual") && $("#pQual").textContent) || "auto";
  const next = labels[(labels.indexOf(curLbl) + 1) % labels.length] || "auto";
  if(next === "auto"){ S.quality = "auto"; saveSet(); toast("Kualitas: Auto"); loadSource(vEp); return; }
  S.quality = next; saveSet(); toast("Kualitas: " + next);
  loadSource(vEp);
}

function cycleCC(){
  if(subMode === "off"){ subMode = "vtt"; if(!subCues.length) $("#subFile").click(); }
  else subMode = "off";
  applyCC();
}
function applyCC(){
  const chip = $("#pCC"), box = $("#pSub");
  if(!chip || !box) return;
  const on = subMode === "vtt";
  chip.classList.toggle("on", on);
  box.classList.toggle("on", on);
  box.innerHTML = (on && !subCues.length) ? '<span>Pilih file .vtt / .srt</span>' : '';
}
function renderSub(t){
  if(subMode !== "vtt" || !subCues.length) return;
  const box = $("#pSub"); if(!box) return;
  const c = subCues.find(x=> t >= x.s && t <= x.e);
  box.innerHTML = c ? '<span>' + esc(c.t).replace(/\n/g,"<br>") + '</span>' : '';
}
const toSec = s => { const m = String(s).trim().match(/(\d+):(\d+):(\d+)[.,](\d+)/);
  return m ? +m[1]*3600 + +m[2]*60 + +m[3] + +m[4]/1000 : 0; };
function parseSubs(txt){
  const out = [];
  txt.replace(/\r/g,"").split(/\n\n+/).forEach(block=>{
    const lines = block.split("\n").filter(Boolean);
    const ti = lines.findIndex(l=> l.includes("-->"));
    if(ti < 0) return;
    const [a,b] = lines[ti].split("-->");
    const s = toSec(a), e = toSec(b);
    const text = lines.slice(ti+1).join("\n").trim();
    if(text && e > s) out.push({s,e,t:text});
  });
  return out.sort((x,y)=> x.s - y.s);
}

function step(dir){
  const list = (curDetail.videos||[]);
  const target = vEp + dir;
  if(!list.some(v=> v.episode === target)){ toast(dir > 0 ? "Ini episode terakhir" : "Ini episode pertama"); return; }
  const hh = S.hist.find(x=> x.id === curDetail.id);
  playEpisode(target, (hh && hh.ep === target) ? (hh.t||0) : 0);
}
function closePlayer(){
  clearTimeout(wd); clearTimeout(bufT);
  stopWatch(); wake(false); destroyHls();
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  const v = $("#pvideo");
  if(v){
    if(v.duration) pushHist(curDetail, vEp, v.currentTime, v.duration);
    try{ v.pause(); }catch(e){}
    v.removeAttribute("src"); try{ v.load(); }catch(e){}
  }
  $("#player").classList.remove("open"); $("#player").innerHTML = "";
  vData = null; updateContBar();
  if(S.view === "hist") renderHist();
}

/* ---------- back handler untuk tombol fisik ---------- */
window.__back = function(){
  try{
    if(document.fullscreenElement){ document.exitFullscreen(); return 1; }
    const panel = $("#pEpsPanel");
    if(panel && panel.classList.contains("open")){ panel.classList.remove("open"); return 1; }
    if($("#player").classList.contains("open")){ closePlayer(); return 1; }
    if($("#detail").classList.contains("open")){ closeDetail(); return 1; }
    if(S.view !== "feed"){ go("feed"); return 1; }
    if(S.view === "feed" && $("#v-feed").scrollTop > 40){ $("#v-feed").scrollTop = 0; return 1; }
    return 0;
  }catch(e){ return 0; }
};

  $$(".nav-item").forEach(b=> b.onclick = ()=> go(b.dataset.nav));
  $("#feedSearch").onclick = ()=>{ go("search"); setTimeout(()=> $("#searchInput").focus(), 120); };
  $("#feedRandom").onclick = randomPick;
  $("#exploreRandom").onclick = randomPick;

  new IntersectionObserver(es=>{
    if(es[0].isIntersecting && S.view === "feed" && !S.feedDone) loadFeed(false);
  }, {rootMargin:"400px"}).observe($("#feedSentinel"));

  $("#exploreInput").addEventListener("input", ev=>{

    S.searchTimer = setTimeout(()=>{ if(q.trim()){ go("search"); $("#searchInput").value = q; doSearch(q); } }, 450);

  });

  $("#histBack").onclick = ()=> go("me");

      subCues = parseSubs(String(r.result));

  document.addEventListener("visibilitychange", ()=>{

  window.addEventListener("online", ()=>{

    if(v && v.src && v.error) retrySame();
  });

  const dl = new URLSearchParams(location.search).get("d");

  window.__go = go;
  document.addEventListener("keydown", ev=>{
    if(ev.key === "Escape"){
      if($("#player").classList.contains("open")) closePlayer();
      else if($("#detail").classList.contains("open")) closeDetail();
    }
  });
}

  openDetail(src[Math.floor(Math.random()*src.length)].id);
}
